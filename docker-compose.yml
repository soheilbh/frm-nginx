name: frm_nginx

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: frm-nginx:local
    container_name: frm-nginx
    ports:
      - "1443:1443"
      - "18443:18443"
    environment:
      FRM_VM_IP: ${FRM_VM_IP:?FRM_VM_IP is required}
    networks:
      - frm-ai
    restart: unless-stopped

networks:
  frm-ai:
    name: frm_ai_frm-ai-network
    driver: bridge
